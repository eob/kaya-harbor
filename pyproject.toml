[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaya-harbor"
version = "0.1.0"
description = "Harbor evaluation adapter for the Kaya agentic programming language and runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Edward Benson", email = "eob@cs.stanford.edu" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "build>=1.0.0",
]
harbor = [
    "harbor>=0.1.0",
]

[project.scripts]
kaya-harbor = "kaya_harbor.cli:main"

[project.entry-points."harbor.agents"]
kaya = "kaya_harbor.agent:KayaHarborAgent"
kaya_harbor = "kaya_harbor.agent:KayaHarborAgent"

[tool.hatch.build.targets.wheel]
packages = ["src/kaya_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
